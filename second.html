<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Timer 💖</title>
    <link rel="stylesheet" href="second.css">
    <script>
        function updateLoveTime() {
            const startDate = new Date(2024, 11, 20); // 20 ธ.ค. 2567
            const now = new Date();
            const diff = now - startDate;

            const seconds = Math.floor(diff / 1000) % 60;
            const minutes = Math.floor(diff / (1000 * 60)) % 60;
            const hours = Math.floor(diff / (1000 * 60 * 60)) % 24;
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const years = Math.floor(days / 365);
            const months = Math.floor((days % 365) / 30);
            const remainingDays = (days % 365) % 30;

            document.getElementById("years").textContent = years;
            document.getElementById("months").textContent = months;
            document.getElementById("days").textContent = remainingDays;
            document.getElementById("hours").textContent = hours;
            document.getElementById("minutes").textContent = minutes;
            document.getElementById("seconds").textContent = seconds;

            setTimeout(updateLoveTime, 1000);
        }
    </script>
</head>
<body onload="updateLoveTime()">
    <div class="container">
        <h1>💖 We have been together for 💖</h1>
        <div class="time-box">
            <span id="years">0</span> Years
            <span id="months">0</span> Months
            <span id="days">0</span> Days
        </div>
        <div class="time-box small">
            <span id="hours">00</span> Hrs
            <span id="minutes">00</span> Mins
            <span id="seconds">00</span> Secs
        </div>
        <div class="name-box"> BOSS & NAMO </div>
        <button class="next-btn" onclick="window.location.href='Third.html'">Next ➜</button>
    </div>
</body>
</html>
